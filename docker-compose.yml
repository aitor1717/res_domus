services:
  app:
    build:
      context: ./app
      args:
        APP_UID: ${APP_UID:-1000}
    expose:
      - "5000"
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
      - ./app/aux_items.csv:/app/aux_items.csv
      - ./app/aux_items_en.csv:/app/aux_items_en.csv
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - TEST_RUN=${TEST_RUN:-}
      - INSTANCE_LABEL=${INSTANCE_LABEL:-res domus}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-}
      # Set DEMO_MODE=1 in .env to run *this* instance read-only with sample
      # data - e.g. for a public demo before you've set up your own personal
      # instance. Defaults off (0), same as before this var existed.
      - DEMO_MODE=${DEMO_MODE:-0}
    restart: unless-stopped

  # Optional reverse proxy for automatic HTTPS — only needed if you're exposing
  # this to the internet with a domain. Local/LAN use doesn't need it.
  # Enable with: docker compose --profile https up
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
